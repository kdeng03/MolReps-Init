# Supported model schema for mol-llm, using **canonical** model names among this project.
# Each model has its own complete vLLM configuration.
#
# Naming convention: {base_model}_{training_format}_{task}
#   - base_model: qwen3_4b_i, qwen3_vl_4b_i
#   - training_format: sft_lora, sft_full, dpo_lora, ...
#   - task: ocr, ocr_conversion, ...
#
# modality: "llm" (text-only) or "vlm" (vision-language)
# type: "base" (HF model or local path) or "lora" (base + LoRA adapter)
#
# vllm_init: common LLM() constructor args (required)
# vllm_extra: model-specific LLM() args (optional)
# vllm_lora_request: LoRARequest args (required when type=lora)

vllm:
  # ============================================================
  # SFT LoRA Models
  # ============================================================

  # --- LLM + SFT LoRA: Conversion ---
  qwen3_4b_i_sft_lora_conversion:
    modality: llm
    type: lora
    vllm_init:
      model: Qwen/Qwen3-4B-Instruct-2507
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_002807" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_112227" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_125424" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_142404" # v0 success
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1/20260812_171808" # max_length=6000
      path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1/20260813_142640" # max_length=10000
      name: conversion
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_conversion
    description: "LLM SFT LoRA for molecular representation conversion"
    tags: [llm, sft, lora, conversion]

  # --- VLM + SFT LoRA: Conversion ---
  qwen3_vl_4b_i_sft_lora_conversion:
    modality: vlm
    type: lora
    vllm_init:
      model: Qwen/Qwen3-VL-4B-Instruct
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/20260811_210433"  # v0
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260813_162701" # v1, epoch=3
      path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260813_162701/checkpoint-438" # v1, epoch=2
      name: conversion
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_conversion
    description: "VLM SFT LoRA for molecular representation conversion (text-only, no image)"
    tags: [vlm, sft, lora, conversion]

  # --- VLM + SFT LoRA: OCR ---
  qwen3_vl_4b_i_sft_lora_ocr:
    modality: vlm
    type: lora
    vllm_init:
      model: Qwen/Qwen3-VL-4B-Instruct
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/20260811_202150"  # v0
      path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1/20260813_181545/checkpoint-100" # v1, epoch-5
      name: ocr
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_ocr
    description: "VLM SFT LoRA for molecular structure OCR (image → SMILES)"
    tags: [vlm, sft, lora, ocr]

