# Supported model schema for mol-llm, using **canonical** model names among this project.
# Each model has its own complete vLLM configuration.
#
# Naming convention: {base_model}_{training_format}_{task}
#   - base_model: qwen3_4b_i, qwen3_vl_4b_i
#   - training_format: sft_lora, sft_full, dpo_lora, ...
#   - task: ocr, ocr_conversion, ...
#
# modality: "llm" (text-only) or "vlm" (vision-language)
# type: "base" (HF model or local path) or "lora" (base + LoRA adapter)
#
# vllm_init: common LLM() constructor args (required)
# vllm_extra: model-specific LLM() args (optional)
# vllm_lora_request: LoRARequest args (required when type=lora)

vllm:
  # ============================================================
  # Base Models
  # ============================================================

  # --- LLM Base ---
  qwen3_4b_i:
    modality: llm
    type: base
    vllm_init:
      model: Qwen/Qwen3-4B-Instruct-2507
      # max_model_len: 8192
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
      dtype: auto
    vllm_extra: {}
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: base
    training_method: base
    task: null
    description: "Qwen3 4B Instruct 2507, base language model"
    tags: [llm, qwen, base]

  # --- VLM Base ---
  qwen3_vl_4b_i:
    modality: vlm
    type: base
    vllm_init:
      model: Qwen/Qwen3-VL-4B-Instruct
      # max_model_len: 8192
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      trust_remote_code: true
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: base
    training_method: base
    task: null
    description: "Qwen3 VL 4B Instruct, base vision-language model"
    tags: [vlm, qwen, base]

  # ============================================================
  # SFT LoRA Models
  # ============================================================

  # --- LLM + SFT LoRA: Conversion ---
  qwen3_4b_i_sft_lora_conversion:
    modality: llm
    type: lora
    vllm_init:
      model: Qwen/Qwen3-4B-Instruct-2507
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_002807" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_112227" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_125424" # chat_template_fail
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/20260812_142404" # v0 success
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1/20260812_171808" # max_length=6000
      # path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1/20260813_142640" # max_length=10000
      path: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1.1/20260814_235452" # v1.1, epoch=10
      name: conversion

    ### Ablation
    ablation_configs:
      num_train_epoch: ## TODO: should be num_train_epochs
        vllm_lora_request:
          path_dir: "ckpt/conversion/qwen3_4b_i_sft_lora_conversion/v1.1/20260814_235452/"
          name: conversion
  
    sampling_params:
      temperature: 0.0
      max_tokens: 512
    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_conversion
    description: "LLM SFT LoRA for molecular representation conversion"
    tags: [llm, sft, lora, conversion]

  # --- VLM + SFT LoRA: Conversion ---
  qwen3_vl_4b_i_sft_lora_conversion:
    modality: vlm
    type: lora

    ### vLLM Config
    vllm_init:
      model: Qwen/Qwen3-VL-4B-Instruct
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/20260811_210433"  # v0
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260813_162701" # v1, epoch=3
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260813_162701/checkpoint-438" # v1, epoch=2
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260814_024750" # v1, epoch=14 (e-s, loss)
      # path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1/20260814_024750/checkpoint-2628" # v1, epoch=12 (e-s, patience=1)
      path: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1.1/20260815_095650" # v1.1, epoch=10 (e-s, patience=2)
      name: conversion

    ### Ablation
    ablation_configs:
      num_train_epoch: ## TODO: should be num_train_epochs
        vllm_lora_request:
          path_dir: "ckpt/conversion/qwen3_vl_4b_i_sft_lora_conversion/v1.1/20260815_095650/"
          name: conversion

    sampling_params:
      temperature: 0.0
      max_tokens: 512

    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_conversion
    description: "VLM SFT LoRA for molecular representation conversion (text-only, no image)"
    tags: [vlm, sft, lora, conversion]

  # --- VLM + SFT LoRA: OCR ---
  qwen3_vl_4b_i_sft_lora_ocr:
    modality: vlm
    type: lora
    vllm_init:
      model: Qwen/Qwen3-VL-4B-Instruct
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/20260811_202150"  # v0
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1/20260813_181545/checkpoint-100" # v1, epoch=5
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1/20260813_213908" # v1, epoch=4 (early-stop)
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1/20260813_221433" # v1, epoch=4 (early-stop, patience=2)
      # path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1/20260813_224058" # v1, epoch=8 (e-s, mean_token_accuracy)
      path: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1.1/20260814_162454" # v1.1, epoch=4 (e-s, loss)
      name: 
      
    ### Ablation
    ablation_configs:
      num_train_epoch: ## TODO: should be num_train_epochs
        vllm_lora_request:
          path_dir: "ckpt/ocr/qwen3_vl_4b_i_sft_lora_ocr/v1.1/20260814_162454/"
          name: ocr

    sampling_params:
      temperature: 0.0
      max_tokens: 512

    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: base
    task: mol_rep_ocr
    description: "VLM SFT LoRA for molecular structure OCR (image → SMILES)"
    tags: [vlm, sft, lora, ocr]

  # --- VLM + SFT LoRA: OCR + Conversion (cold start) ---
  qwen3_vl_4b_i_sft_lora_ocr_conversion:
    modality: vlm
    type: lora
    vllm_init:
      model: kdeng03/MolQwen3-VL-4B-Instruct-SFT-OCR
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      path: "ckpt/ocr_conversion/qwen3_vl_4b_i_sft_lora_ocr_conversion/v1.1/20260816_195334/checkpoint-4370" # v1.1, epoch=10 (e-s, loss, patience=2, threshold=0.0)
      # path: "ckpt/ocr_conversion/qwen3_vl_4b_i_sft_lora_ocr_conversion/v1.1/20260816_195334/checkpoint-1748" # v1.1, epoch=4
      name: ocr_conversion

    ### Ablation
    ablation_configs:
      num_train_epoch: ## TODO: should be num_train_epochs
        vllm_lora_request:
          path_dir: "ckpt/ocr_conversion/qwen3_vl_4b_i_sft_lora_ocr_conversion/v1.1/20260816_195334/"
          name: ocr_conversion

    sampling_params:
      temperature: 0.0
      max_tokens: 512

    # Metadata
    training_stage: sft
    training_method: sft_lora
    parent_training_method: sft_lora
    task: mol_rep_ocr_conversion
    description: "VLM SFT LoRA for OCR + molecular representation conversion (cold start)"
    tags: [vlm, sft, lora, ocr, conversion]

  # --- VLM + GRPO LoRA: Conversion ---
  qwen3_vl_4b_i_grpo_lora_from_sft_lora_ocr_conversion:
    modality: vlm
    type: lora
    vllm_init:
      model: kdeng03/MolQwen3-VL-4B-Instruct-SFT
      max_model_len: 16384
      gpu_memory_utilization: 0.88
      max_num_seqs: 256
    vllm_extra:
      enable_lora: true
    vllm_lora_request:
      # path: "ckpt/conversion/grpo/qwen3_vl_4b_i_grpo_lora_conversion_from_sft_lora/v1.1/20260820_234432/checkpoint-42" # w/ entropy coef
      # path: "ckpt/conversion/grpo/qwen3_vl_4b_i_grpo_lora_conversion_from_sft_lora/v1.1/20260821_131621/checkpoint-42" # baseline
      # path: "ckpt/conversion/grpo/qwen3_vl_4b_i_grpo_lora_conversion_from_sft_lora/v1.1/20260821_203456/checkpoint-42" # top entropy quantile=0.2
      path: "ckpt/conversion/grpo/qwen3_vl_4b_i_grpo_lora_conversion_from_sft_lora/v1.1/20260822_010614/checkpoint-42" # lr=1e-4
      name: conversion

    ### Ablation
    ablation_configs:
      num_train_epoch: ## TODO: should be num_train_epochs
        vllm_lora_request:
          path_dir: "ckpt/conversion/grpo/qwen3_vl_4b_i_grpo_lora_conversion_from_sft_lora/v1.1/20260822_180426/"
          name: conversion

    sampling_params:
      temperature: 0.0
      max_tokens: 512

    # Metadata
    training_stage: grpo
    training_method: grpo_lora
    parent_training_method: sft_lora
    task: mol_rep_conversion
    description: "VLM GRPO LoRA for molecular representation conversion (from SFT LoRA OCR + Conversion)"
    tags: [vlm, grpo, lora, conversion]